name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Type check
        run: python -m mypy src/rudder
      - name: Offline tests
        run: python -m pytest tests/unit tests/contract -m "not provider_live" -q
      - name: Fake-provider smoke
        run: python scripts/smoke.py --fake-provider
