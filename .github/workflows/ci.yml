name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  offline:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests scripts evals
      - name: Type check
        run: python -m mypy src/skail
      - name: Offline tests
        run: python -m pytest tests/unit tests/contract -m "not provider_live" -q
      - name: Fake-provider smoke
        run: python scripts/smoke.py --fake-provider

  required-fast-gate:
    name: Required fast gate
    if: always()
    needs: [offline]
    runs-on: ubuntu-latest
    steps:
      - name: Require the full platform and Python matrix
        env:
          OFFLINE_RESULT: ${{ needs.offline.result }}
        run: |
          if [ "$OFFLINE_RESULT" != "success" ]; then
            echo "The offline CI matrix did not complete successfully: $OFFLINE_RESULT" >&2
            exit 1
          fi
