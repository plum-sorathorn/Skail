name: Release CI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"

jobs:
  validate-and-build:
    name: Test & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify isolated package artifacts
        run: >-
          python scripts/package_check.py
          --artifact-dir "${{ runner.temp }}/skail-package-artifacts"
          --evidence "${{ runner.temp }}/skail-package-evidence.json"

      - name: Run release packaging verification
        run: >-
          python scripts/release_check.py
          --artifact-dir "${{ runner.temp }}/skail-package-artifacts"
          --evidence-dir "${{ runner.temp }}/skail-release-evidence"

      - name: Upload package evidence
        uses: actions/upload-artifact@v4
        with:
          name: skail-package-evidence-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/skail-package-artifacts
            ${{ runner.temp }}/skail-package-evidence.json
            ${{ runner.temp }}/skail-release-evidence
          if-no-files-found: error
