name: Release CI

on:
  push:
    branches: [main, rudder]
    tags: ['v*']
  pull_request:
    branches: [main, rudder]

jobs:
  validate-and-build:
    name: Test & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Code formatting and linting
        run: python -m ruff check src tests scripts evals

      - name: Type checking
        run: python -m mypy src/rudder

      - name: Run offline test suite
        run: python -m pytest -q

      - name: Run fake-provider smoke test
        run: python scripts/smoke.py --fake-provider

      - name: Build wheel and sdist
        run: python -m build

      - name: Run release packaging verification
        run: python scripts/release_check.py
