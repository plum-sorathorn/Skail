[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "skail-harness"
version = "0.1.0"
description = "Skail, a native budget-aware multi-agent coding harness"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Skail contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "deepagents==0.7.13",
  "langchain==1.4.2",
  "langchain-core==1.6.1",
  "langgraph==1.2.11",
  "langgraph-checkpoint==4.2.0",
  "langgraph-checkpoint-sqlite==3.1.1",
  "httpx>=0.28,<1",
  "textual>=1.0.0,<2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.13",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "langchain-openai==1.6.0",
]
openai-compatible = ["langchain-openai==1.6.0"]
openai = ["langchain-openai==1.6.0"]
anthropic = ["langchain-anthropic==1.7.0"]

[project.scripts]
skail = "skail.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["skail", "skail.*"]
namespaces = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [".", "src", "tests"]
norecursedirs = ["legacy", ".git", "build", "dist"]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib"]
asyncio_mode = "auto"
markers = [
  "unit: deterministic isolated tests",
  "contract: framework, provider, and CLI contract tests",
  "integration: multi-component tests",
  "e2e: installed-command end-to-end tests",
  "provider_live: opt-in tests requiring --run-provider-live and named credentials",
]

[tool.mypy]
python_version = "3.12"
files = ["src/skail"]
strict = true
exclude = "^legacy/"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
